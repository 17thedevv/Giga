# Giga — Local Development PostgreSQL Infrastructure
# Run: docker compose -f infra/docker/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: giga-postgres-dev
    environment:
      POSTGRES_USER: giga
      POSTGRES_PASSWORD: giga_dev_password
      POSTGRES_DB: giga_dev
    ports:
      - "5432:5432"
    volumes:
      - giga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giga -d giga_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  giga_pgdata:
