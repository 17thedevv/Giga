worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    access_log off;
    log_format giga_ops escape=json '{"timestamp":"$time_iso8601","service":"giga-nginx","event":"http_edge","requestId":"$upstream_http_x_request_id","status":"$status","durationSeconds":"$request_time"}';
    include /etc/nginx/giga-allowed-hosts.conf;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080 default_server;
        include /etc/nginx/giga-common.conf;
    }
    server {
        listen 8081;
        location = /health { return 200 'ok'; }
        location / { return 404; }
    }
}
