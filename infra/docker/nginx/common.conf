# Included in the externally reachable server only. Origin/Referer reach Hono unchanged.
client_max_body_size 1m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 120s;
server_tokens off;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header Cache-Control 'no-store' always;
proxy_hide_header Cache-Control;
proxy_http_version 1.1;
proxy_set_header Connection '';
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# Single trusted edge; discard client-supplied forwarding chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;
proxy_buffering off;
proxy_request_buffering off;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_next_upstream off;
gzip off;
# Docker DNS is refreshed after API recreation (rollback/rebuild).
resolver 127.0.0.11 valid=5s ipv6=off;
set $giga_api http://api:3000;
location = /api { proxy_pass $giga_api; }
location ^~ /api/ { proxy_pass $giga_api; }
# Hono owns the reviewed SPA fallback and structured API 404s.
location / { proxy_pass $giga_api; }
