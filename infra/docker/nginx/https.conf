worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    access_log off;
    log_format giga_ops escape=json '{"timestamp":"$time_iso8601","service":"giga-nginx","event":"http_edge","requestId":"$upstream_http_x_request_id","status":"$status","durationSeconds":"$request_time"}';
    include /etc/nginx/giga-allowed-hosts.conf;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080 default_server;
        server_tokens off;
        if ($giga_host_allowed = 0) { return 444; }
        return 308 https://$host$request_uri;
    }
    server {
        listen 8443 ssl default_server;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        include /etc/nginx/giga-common.conf;
        add_header Strict-Transport-Security 'max-age=31536000' always;
    }
    server {
        listen 8081;
        location = /health { return 200 'ok'; }
        location / { return 404; }
    }
}
