name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  test-backend:
    name: Build, Typecheck and Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: giga_ci
          POSTGRES_PASSWORD: giga_ci_password
          POSTGRES_DB: giga_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U giga_ci -d giga_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build API service
        run: npm run build

      - name: Run unit and integration tests (Real PostgreSQL)
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://giga_ci:giga_ci_password@localhost:5432/giga_ci_test
        run: npm test
